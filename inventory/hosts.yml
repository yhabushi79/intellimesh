---
all:
  vars:
    ansible_user: root
    # Password auth — set ANSIBLE_PASSWORD in the environment, or use --ask-pass
    ansible_password: "{{ lookup('env', 'ANSIBLE_PASSWORD') }}"
    ansible_ssh_common_args: "-o PreferredAuthentications=password -o PubkeyAuthentication=no"
    demo_domain: app-demo.example.com
    tls_cert_path: /etc/pki/tls/certs/demo.crt
    tls_key_path: /etc/pki/tls/private/demo.key

  children:
    # Receives Satellite crypto change AND AAP legacy SSL template
    patched:
      hosts:
        rhel-patched:
          ansible_host: 10.46.253.221

    # Receives Satellite crypto change only (healthy control)
    control:
      hosts:
        rhel-control:
          ansible_host: 10.46.250.70

    # Both demo RHEL VMs
    app_hosts:
      children:
        patched:
        control:
