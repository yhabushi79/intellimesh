---
# Phase 1a — Verify Satellite applied FUTURE:CLASSICAL-COMPAT to BOTH VMs
# The actual change is done in the Satellite GUI. This playbook verifies it.
#
# Satellite GUI action:
#   Target: BOTH backend VMs (rhel-patched + rhel-control)
#   Command: update-crypto-policies --set FUTURE:CLASSICAL-COMPAT

- name: "Phase 1a — Verify Satellite crypto-policy change (both backends)"
  hosts: backends
  become: true

  tasks:
    - name: Read active crypto-policy
      ansible.builtin.command:
        cmd: update-crypto-policies --show
      register: crypto_policy
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: crypto-policy = {{ crypto_policy.stdout }}"

    - name: Assert FUTURE policy is active
      ansible.builtin.assert:
        that:
          - "'FUTURE' in crypto_policy.stdout"
        success_msg: "FUTURE:CLASSICAL-COMPAT confirmed."
        fail_msg: "Expected FUTURE. Got: {{ crypto_policy.stdout }}. Run the Satellite REX command on BOTH VMs first."
