---
# Phase 4 — Probe TLS / payments on both VMs from your laptop

- name: "Phase 4 — Probe TLS and payments API"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    patched_hosts: "{{ groups['patched'] | map('extract', hostvars, 'ansible_host') | list }}"
    control_hosts: "{{ groups['control'] | map('extract', hostvars, 'ansible_host') | list }}"

  tasks:
    - name: "TLS handshake on patched hosts (expect failure)"
      ansible.builtin.command:
        cmd: openssl s_client -connect {{ item }}:443 -brief
      register: patched_tls
      loop: "{{ patched_hosts }}"
      failed_when: false
      timeout: 10

    - name: Show patched host TLS results
      ansible.builtin.debug:
        msg: |
          HOST: {{ item.item }}
          TLS Handshake: {{ 'FAILED' if item.rc != 0 else 'OK' }}
          detail: {{ item.stderr_lines | last | default(item.stdout_lines | last | default('n/a')) }}
      loop: "{{ patched_tls.results }}"

    - name: "TLS handshake on control hosts (expect success)"
      ansible.builtin.command:
        cmd: openssl s_client -connect {{ item }}:443 -brief
      register: control_tls
      loop: "{{ control_hosts }}"
      failed_when: false
      timeout: 10

    - name: Show control host TLS results
      ansible.builtin.debug:
        msg: |
          HOST: {{ item.item }} (control)
          TLS Handshake: {{ 'FAILED' if item.rc != 0 else 'OK' }}
      loop: "{{ control_tls.results }}"

    - name: HTTPS calls to payments API
      ansible.builtin.uri:
        url: "https://{{ item }}:443/api/payments"
        validate_certs: false
        timeout: 5
      register: payments_result
      loop: "{{ patched_hosts + control_hosts }}"
      failed_when: false

    - name: Show payments API results
      ansible.builtin.debug:
        msg: |
          HOST: {{ item.item }}
          Status: {{ item.status | default('CONNECTION_FAILED') }}
          {{ 'PAYMENTS DEGRADED' if (item.status | default(0) | int) >= 500 else '' }}
          {{ 'HANDSHAKE/CONNECT FAILED' if item.failed | default(false) and (item.status | default(0) | int) == 0 else '' }}
          {{ 'OK' if (item.status | default(0) | int) == 200 else '' }}
      loop: "{{ payments_result.results }}"

    - name: Incident summary from probes
      ansible.builtin.debug:
        msg: |
          INCIDENT SIGNAL
          Affected (patched): {{ patched_hosts | join(', ') }}
          Unaffected (control): {{ control_hosts | join(', ') }}
          Symptom: TLS handshake failure where FUTURE + legacy cipher pin both exist
