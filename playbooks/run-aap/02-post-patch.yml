---
# Phase 2 — Post-patch (run via AAP job template)
#
# AAP UI: create/launch job template → this playbook
# Limit / inventory group: patched (rhel-patched only)
#
# Pins AES128-SHA / AES256-SHA — blocked by FUTURE crypto-policy.

- name: "Phase 2 — Post-patch: restart nginx + apply legacy SSL template"
  hosts: patched
  become: true

  tasks:
    - name: Restart nginx after patching
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: Apply legacy SSL hardening template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/legacy-ssl-hardening.conf.j2"
        dest: /etc/nginx/conf.d/ssl-hardening.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: Verify nginx config syntax
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_syntax
      changed_when: false

    - name: Post-patch result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: nginx restarted, legacy SSL template applied.

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
