---
# Phase 1b — AAP "Routine Security Compliance" job
# Regenerates the TLS certificate with RSA-6144 and disables session caching.
# RSA-6144 signing costs ~15-20ms per handshake on x86_64 (vs ~3-5ms for RSA-4096).
# Combined with session cache disabled, every request forces a full expensive handshake.
#
# AAP job template: "IntelliMesh Security Compliance"
# Limit: patched

- name: "Phase 1b — Inject TLS compliance override (RSA-6144 + disable session cache)"
  hosts: "{{ target_vms | default('patched') }}"
  become: true

  vars:
    tls_cert_path: /etc/pki/tls/certs/demo.crt
    tls_key_path: /etc/pki/tls/private/demo.key
    demo_domain: app-demo.example.com

  tasks:
    - name: Remove existing TLS certificate (compliance requires RSA-6144)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ tls_cert_path }}"
        - "{{ tls_key_path }}"

    - name: Generate RSA-6144 TLS certificate (compliance mandate)
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:6144
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"
      notify: restart httpd

    - name: Set key file permissions
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Overwrite SSL session params with compliance override
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/tls-compliance-override.conf.j2"
        dest: /etc/httpd/conf.d/ssl-params.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart httpd

    - name: Verify httpd config syntax
      ansible.builtin.command:
        cmd: httpd -t
      register: httpd_syntax
      changed_when: false

    - name: Injection result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: TLS cert upgraded to RSA-6144 + session cache disabled.
          Every HTTPS request now requires a full handshake with expensive 6144-bit signing.
          Under load → CPU starvation on TLS handshakes.

  handlers:
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
