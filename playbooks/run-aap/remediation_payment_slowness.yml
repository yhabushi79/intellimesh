---
- name: Remediate Payment Service Slowness on Affected Host
  hosts: "10.46.253.221,IntelliMesh-patched-group,patched"
  become: true
  vars:
    demo_domain: "app-demo.example.com"
    tls_cert_path: "/etc/pki/tls/certs/demo.crt"
    tls_key_path: "/etc/pki/tls/private/demo.key"

  tasks:
    - name: Ensure crypto-policy is set to DEFAULT baseline
      ansible.builtin.command:
        cmd: update-crypto-policies --set DEFAULT
      register: crypto_policy_result
      changed_when: true

    - name: Regenerate baseline RSA 2048-bit TLS key and certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:2048
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"

    - name: Set TLS key permissions
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Set TLS cert permissions
      ansible.builtin.file:
        path: "{{ tls_cert_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Restore SELinux context on TLS certs
      ansible.builtin.command:
        cmd: restorecon -v {{ tls_cert_path }} {{ tls_key_path }}
      changed_when: false
      failed_when: false

    - name: Restore baseline SSL session parameters
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/ssl-params.conf
        content: |
          Listen 443 https
          SSLSessionCache shmcb:/run/httpd/sslcache(512000)
          SSLSessionCacheTimeout 300
          SSLSessionTickets on
        owner: root
        group: root
        mode: "0644"

    - name: Remove any compliance override config if present
      ansible.builtin.file:
        path: /etc/httpd/conf.d/tls-compliance-override.conf
        state: absent

    - name: Validate httpd configuration syntax
      ansible.builtin.command:
        cmd: httpd -t
      register: httpd_syntax
      changed_when: false

    - name: Restart Apache service (httpd)
      ansible.builtin.service:
        name: httpd
        state: restarted
        enabled: true

    - name: Verify TLS handshake and response performance
      ansible.builtin.shell:
        cmd: >
          curl -sk -o /dev/null -w
          "TCP: %{time_connect}s | TLS: %{time_appconnect}s | Total: %{time_total}s"
          https://localhost/api/health
      register: tls_verify
      changed_when: false

    - name: Remediation completion report
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Crypto Policy: DEFAULT"
          - "TLS Key: RSA 2048-bit regenerated"
          - "SSL Session Cache: Enabled (shmcb)"
          - "HTTPD Status: Restarted"
          - "Local TLS Performance: {{ tls_verify.stdout }}"
