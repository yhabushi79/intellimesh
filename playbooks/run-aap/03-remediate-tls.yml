---
- name: "Remediate: Restore TLS Performance"
  hosts: 10.46.253.221
  become: true

  vars:
    tls_cert_path: /etc/pki/tls/certs/demo.crt
    tls_key_path: /etc/pki/tls/private/demo.key
    demo_domain: app-demo.example.com

  tasks:
    - name: Restore RSA-4096 TLS certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:4096
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"
      notify: restart httpd

    - name: Restore baseline SSL session parameters
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/ssl-params.conf
        content: |
          Listen 443 https
          SSLSessionCache shmcb:/run/httpd/sslcache(512000)
          SSLSessionCacheTimeout 300
          SSLSessionTickets on
      notify: restart httpd

    - name: Verify TLS certificate key size is 4096 bit
      ansible.builtin.shell:
        cmd: "openssl x509 -in {{ tls_cert_path }} -text -noout | grep -E 'Public-Key: \\(4096 bit\\)'"
      register: cert_key_check
      changed_when: false

  handlers:
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
