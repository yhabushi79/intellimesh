---
# Phase 7 — Remediation (run via AAP job template)
#
# AAP UI: launch against patched only (rhel-patched)
# Removes legacy cipher pin and reloads nginx.

- name: "Phase 7 — Targeted remediation (patched hosts only)"
  hosts: "{{ target_vms }}"
  become: true

  tasks:
    - name: Remove legacy SSL hardening config
      ansible.builtin.file:
        path: /etc/nginx/conf.d/ssl-hardening.conf
        state: absent

    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_validate
      changed_when: false

    - name: Reload nginx with system crypto-policy defaults
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Verify TLS handshake is restored
      ansible.builtin.shell:
        cmd: echo | openssl s_client -connect localhost:443 2>&1 | grep -E "Cipher is|Cipher\s*:"
      register: tls_verify
      changed_when: false

    - name: Verify payments API responds
      ansible.builtin.uri:
        url: "https://localhost/api/payments"
        validate_certs: false
      register: payments_check

    - name: Remediation result
      ansible.builtin.debug:
        msg: |
          HOST: {{ inventory_hostname }}
          TLS: {{ tls_verify.stdout | default('see openssl output') }}
          Payments API: {{ payments_check.status }} — {{ payments_check.json | default({}) }}
          Status: RESOLVED

- name: "Phase 7 — Verify control host was not targeted"
  hosts: control
  become: true

  tasks:
    - name: Confirm control host still healthy
      ansible.builtin.uri:
        url: "https://localhost/api/payments"
        validate_certs: false
      register: control_check

    - name: Control host result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} (control): payments API
          {{ control_check.status }} — unchanged by remediation
