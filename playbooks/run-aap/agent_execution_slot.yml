---
- name: Remediate Payment Backend Crypto Policy Drift
  hosts: 10.46.250.70, 10.46.253.221
  become: true
  tasks:
    - name: Revert system crypto policy to DEFAULT
      ansible.builtin.command: update-crypto-policies --set DEFAULT
      register: update_crypto
      changed_when: update_crypto.rc == 0

    - name: Restart httpd service
      ansible.builtin.service:
        name: httpd
        state: restarted
      ignore_errors: true
