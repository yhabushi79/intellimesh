---
- name: Remediate TLS Certificate and SSL Params
  hosts: all
  become: true
  vars:
    demo_domain: "app-demo.example.com"
    tls_cert_path: "/etc/pki/tls/certs/demo.crt"
    tls_key_path: "/etc/pki/tls/private/demo.key"

  tasks:
    - name: Generate self-signed TLS cert (RSA 4096)
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:4096
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"
      changed_when: true

    - name: Set key file permissions
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Set cert file permissions
      ansible.builtin.file:
        path: "{{ tls_cert_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Restore SELinux context on TLS files
      ansible.builtin.command:
        cmd: restorecon -v {{ tls_cert_path }} {{ tls_key_path }}
      changed_when: false
      failed_when: false

    - name: Restore SSL session parameters
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/ssl-params.conf.j2"
        dest: /etc/httpd/conf.d/ssl-params.conf
        owner: root
        group: root
        mode: "0644"

    - name: Validate httpd configuration
      ansible.builtin.command:
        cmd: httpd -t
      register: httpd_validate
      changed_when: false

    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: Validate - httpd is active
      ansible.builtin.command: systemctl is-active httpd
      register: svc_check
      changed_when: false
      failed_when: svc_check.stdout.strip() != 'active'

    - name: Validate - port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 10

    - name: Validate - endpoint responds
      ansible.builtin.uri:
        url: "https://localhost/api/health"
        validate_certs: false
        status_code: 200
        timeout: 10
