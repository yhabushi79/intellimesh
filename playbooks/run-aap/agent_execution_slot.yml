---
- name: Remediate TLS Compliance Issue
  hosts: all
  become: yes
  tasks:
    - name: Check ssl error log
      ansible.builtin.command: cat /var/log/httpd/ssl_error_log
      register: ssl_error_log
      ignore_errors: true

    - name: Print ssl error log
      ansible.builtin.debug:
        var: ssl_error_log
