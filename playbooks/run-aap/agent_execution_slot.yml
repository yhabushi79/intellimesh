---
- name: Remediate Node 2 TLS issue
  hosts: all
  become: true
  vars:
    demo_domain: app-demo.example.com
    tls_cert_path: /etc/pki/tls/certs/demo.crt
    tls_key_path: /etc/pki/tls/private/demo.key

  tasks:
    - name: Regenerate self-signed TLS certificate with RSA 2048
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:2048
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"
      
    - name: Set key file permissions
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Restore SELinux context on TLS files
      ansible.builtin.command:
        cmd: restorecon -v {{ tls_cert_path }} {{ tls_key_path }}
      changed_when: false
      failed_when: false

    - name: Restore healthy SSL session parameters
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/ssl-params.conf.j2"
        dest: /etc/httpd/conf.d/ssl-params.conf
        owner: root
        group: root
        mode: "0644"

    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
      register: httpd_restart
      ignore_errors: true

    - name: Get journalctl if httpd fails
      ansible.builtin.command: journalctl -xeu httpd.service
      register: journal_out
      when: httpd_restart.failed

    - name: Debug journalctl
      ansible.builtin.debug:
        var: journal_out.stdout
      when: httpd_restart.failed

    - name: Fail if httpd restart failed
      ansible.builtin.fail:
        msg: "httpd failed to restart"
      when: httpd_restart.failed

    - name: Validate - httpd is active
      ansible.builtin.command: systemctl is-active httpd
      register: svc_check
      changed_when: false
      failed_when: svc_check.stdout.strip() != 'active'

    - name: Validate - port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 10

    - name: Validate - endpoint responds
      ansible.builtin.uri:
        url: "https://localhost/api/health"
        validate_certs: false
        status_code: 200
        timeout: 10
