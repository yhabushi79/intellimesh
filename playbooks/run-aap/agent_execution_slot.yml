---
- name: Remediate TLS Certificate and SSL Configuration on Node 2
  hosts: all
  become: true
  vars:
    demo_domain: "app-demo.example.com"
    tls_cert_path: "/etc/pki/tls/certs/demo.crt"
    tls_key_path: "/etc/pki/tls/private/demo.key"

  tasks:
    - name: Regenerate RSA 2048-bit TLS key and certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:2048
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"

    - name: Set permissions on TLS private key
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Set permissions on TLS certificate
      ansible.builtin.file:
        path: "{{ tls_cert_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Remove SSL configuration override
      ansible.builtin.file:
        path: /etc/httpd/conf.d/ssl-params.conf
        state: absent

    - name: Validate httpd configuration syntax
      ansible.builtin.command:
        cmd: httpd -t
      register: httpd_syntax
      changed_when: false

    - name: Restart httpd service
      ansible.builtin.service:
        name: httpd
        state: restarted
        enabled: true

    - name: Validate - httpd service is active
      ansible.builtin.command:
        cmd: systemctl is-active httpd
      register: httpd_status
      changed_when: false
      failed_when: httpd_status.stdout.strip() != "active"

    - name: Validate - port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 10

    - name: Validate - RSA key size is 2048 bits
      ansible.builtin.shell:
        cmd: "openssl rsa -in {{ tls_key_path }} -text -noout | grep -i '2048 bit'"
      register: key_bits_check
      changed_when: false
      failed_when: key_bits_check.rc != 0

    - name: Validate - direct TLS handshake on Node 2
      ansible.builtin.shell:
        cmd: "openssl s_client -connect 10.46.253.221:443 -servername app-demo.example.com < /dev/null"
      register: openssl_check
      changed_when: false
      failed_when: openssl_check.rc != 0

    - name: Validate - payment API via Nginx LB responds with 200 OK
      ansible.builtin.uri:
        url: "https://10.46.254.38/api/payments"
        validate_certs: false
        status_code: 200
        timeout: 10
      register: api_check
      until: api_check.status == 200
      retries: 3
      delay: 2
