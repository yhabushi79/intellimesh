---
- name: Remediate Node 2 TLS certificate key size, SSL parameters, and crypto policy
  hosts: all
  become: true
  vars:
    demo_domain: app-demo.example.com
    tls_cert_path: /etc/pki/tls/certs/demo.crt
    tls_key_path: /etc/pki/tls/private/demo.key

  tasks:
    - name: Revert system crypto-policy to DEFAULT
      ansible.builtin.command:
        cmd: update-crypto-policies --set DEFAULT
      changed_when: true

    - name: Remove non-baseline compliance override config if present
      ansible.builtin.file:
        path: /etc/httpd/conf.d/tls-compliance-override.conf
        state: absent

    - name: Restore baseline SSL session parameters
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/ssl-params.conf
        content: |
          # Global SSL session parameters (healthy baseline)
          SSLSessionCache shmcb:/run/httpd/sslcache(512000)
          SSLSessionCacheTimeout 300
          SSLSessionTickets on
        owner: root
        group: root
        mode: "0644"

    - name: Regenerate self-signed TLS certificate with RSA-2048
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:2048
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"

    - name: Set private key permissions
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Set certificate permissions
      ansible.builtin.file:
        path: "{{ tls_cert_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Restore SELinux context on TLS cert and key
      ansible.builtin.command:
        cmd: restorecon -v {{ tls_cert_path }} {{ tls_key_path }}
      changed_when: false
      failed_when: false

    - name: Validate httpd configuration syntax
      ansible.builtin.command:
        cmd: httpd -t
      register: httpd_syntax
      changed_when: false

    - name: Restart httpd service
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: Validate - httpd is active
      ansible.builtin.command: systemctl is-active httpd
      register: svc_check
      changed_when: false
      failed_when: svc_check.stdout.strip() != 'active'

    - name: Validate - port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 10

    - name: Validate - TLS certificate key size is 2048 bit
      ansible.builtin.shell:
        cmd: "openssl x509 -in {{ tls_cert_path }} -text -noout | grep -E 'Public-Key: \\(2048 bit\\)'"
      register: cert_key_check
      changed_when: false
      failed_when: cert_key_check.rc != 0

    - name: Validate - crypto-policy is DEFAULT
      ansible.builtin.command:
        cmd: update-crypto-policies --show
      register: crypto_policy_check
      changed_when: false
      failed_when: crypto_policy_check.stdout.strip() != 'DEFAULT'

    - name: Validate - health endpoint responds
      ansible.builtin.uri:
        url: "https://localhost/api/health"
        validate_certs: false
        status_code: 200
        timeout: 10

    - name: Validate - payments endpoint responds
      ansible.builtin.uri:
        url: "https://localhost/api/payments"
        validate_certs: false
        status_code: 200
        timeout: 10
