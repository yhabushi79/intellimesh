---
- name: Revert System Crypto Policy on Affected Nodes
  hosts: 10.46.250.70, 10.46.253.221
  become: true
  tasks:
    - name: Revert system crypto policy to DEFAULT
      ansible.builtin.command: update-crypto-policies --set DEFAULT
      register: crypto_policy_result
      changed_when: crypto_policy_result.rc == 0

- name: Restore TLS and SSL Configuration Baseline on Node 2
  hosts: 10.46.253.221
  become: true
  tasks:
    - name: Remove custom SSL parameters file deployed by Job 115
      ansible.builtin.file:
        path: /etc/httpd/conf.d/ssl-params.conf
        state: absent

    - name: Remove non-compliant 6144-bit RSA private key
      ansible.builtin.file:
        path: /etc/pki/tls/private/demo.key
        state: absent

    - name: Remove non-compliant 6144-bit RSA certificate
      ansible.builtin.file:
        path: /etc/pki/tls/certs/demo.crt
        state: absent

    - name: Restore default SSLCertificateFile reference in httpd configuration
      ansible.builtin.replace:
        path: /etc/httpd/conf.d/ssl.conf
        regexp: 'demo\.crt'
        replace: 'localhost.crt'
      ignore_errors: true

    - name: Restore default SSLCertificateKeyFile reference in httpd configuration
      ansible.builtin.replace:
        path: /etc/httpd/conf.d/ssl.conf
        regexp: 'demo\.key'
        replace: 'localhost.key'
      ignore_errors: true

    - name: Check if default localhost certificate exists
      ansible.builtin.stat:
        path: /etc/pki/tls/certs/localhost.crt
      register: localhost_crt_stat

    - name: Generate standard 2048-bit localhost certificate and key if missing
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/pki/tls/private/localhost.key
        -out /etc/pki/tls/certs/localhost.crt
        -subj "/CN=localhost"
      when: not localhost_crt_stat.stat.exists

- name: Restart Web Services on Affected Nodes
  hosts: 10.46.250.70, 10.46.253.221
  become: true
  tasks:
    - name: Restart httpd service to apply restored baseline configuration
      ansible.builtin.service:
        name: httpd
        state: restarted
