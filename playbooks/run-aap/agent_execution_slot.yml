---
- name: Remediate TLS Compliance Issue
  hosts: all
  become: yes
  tasks:
    - name: Check httpd status
      ansible.builtin.command: systemctl status httpd.service
      register: httpd_status
      ignore_errors: true

    - name: Print httpd status
      ansible.builtin.debug:
        var: httpd_status

    - name: Check journalctl
      ansible.builtin.command: journalctl -xeu httpd.service --no-pager
      register: httpd_journal
      ignore_errors: true

    - name: Print journalctl
      ansible.builtin.debug:
        var: httpd_journal
