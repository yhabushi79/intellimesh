---
- name: Remediate Node 2 configuration drift and HTTPD compliance rules
  hosts: all
  become: true
  vars:
    demo_domain: app-demo.example.com
    tls_cert_path: /etc/pki/tls/certs/demo.crt
    tls_key_path: /etc/pki/tls/private/demo.key

  tasks:
    - name: Ensure crypto policy is set to DEFAULT
      ansible.builtin.command:
        cmd: update-crypto-policies --set DEFAULT
      changed_when: true
      failed_when: false

    - name: Remove non-baseline compliance config drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/httpd/conf.d/compliance.conf
        - /etc/httpd/conf.d/security.conf
        - /etc/httpd/conf.d/tls-compliance-override.conf

    - name: Regenerate self-signed TLS certificate (RSA 4096)
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365
          -newkey rsa:4096
          -keyout {{ tls_key_path }}
          -out {{ tls_cert_path }}
          -subj "/CN={{ demo_domain }}"

    - name: Set key file permissions
      ansible.builtin.file:
        path: "{{ tls_key_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Set cert file permissions
      ansible.builtin.file:
        path: "{{ tls_cert_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Restore SELinux context on TLS files
      ansible.builtin.command:
        cmd: restorecon -v {{ tls_cert_path }} {{ tls_key_path }}
      changed_when: false
      failed_when: false

    - name: Restore healthy SSL session parameters
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/ssl-params.conf.j2"
        dest: /etc/httpd/conf.d/ssl-params.conf
        owner: root
        group: root
        mode: "0644"

    - name: Validate httpd configuration syntax
      ansible.builtin.command:
        cmd: httpd -t
      register: httpd_syntax
      changed_when: false

    - name: Restart httpd service
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: Validate - httpd is active
      ansible.builtin.command: systemctl is-active httpd
      register: svc_check
      changed_when: false
      failed_when: svc_check.stdout.strip() != 'active'

    - name: Validate - port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 10

    - name: Validate - health endpoint responds
      ansible.builtin.uri:
        url: "https://localhost/api/health"
        validate_certs: false
        status_code: 200
        timeout: 10

    - name: Validate - payments endpoint responds
      ansible.builtin.uri:
        url: "https://localhost/api/payments"
        validate_certs: false
        status_code: 200
        timeout: 10
