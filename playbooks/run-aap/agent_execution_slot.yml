---
- name: Remediate Crypto Policy and TLS Overhead on Affected Nodes
  hosts: 10.46.250.70, 10.46.253.221
  become: true
  gather_facts: true

  tasks:
    - name: Reset system cryptographic policy to DEFAULT
      ansible.builtin.command: update-crypto-policies --set DEFAULT
      register: crypto_policy_set
      changed_when: crypto_policy_set.rc == 0

    - name: Remove SSL parameters override configuration on Node 2
      ansible.builtin.file:
        path: /etc/httpd/conf.d/ssl-params.conf
        state: absent
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])

    - name: Remove oversized RSA-6144 TLS private key and certificate on Node 2
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pki/tls/private/demo.key
        - /etc/pki/tls/certs/demo.crt
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])

    - name: Generate standard RSA-2048 TLS private key and self-signed certificate on Node 2
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/pki/tls/private/demo.key
        -out /etc/pki/tls/certs/demo.crt
        -subj "/CN=demo.example.com"
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])
      register: openssl_gen
      changed_when: openssl_gen.rc == 0

    - name: Ensure correct file permissions on private key on Node 2
      ansible.builtin.file:
        path: /etc/pki/tls/private/demo.key
        owner: root
        group: root
        mode: '0600'
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])

    - name: Ensure correct file permissions on certificate on Node 2
      ansible.builtin.file:
        path: /etc/pki/tls/certs/demo.crt
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])

    - name: Restart httpd service to apply crypto policy and restored TLS configuration
      ansible.builtin.service:
        name: httpd
        state: restarted
        enabled: true

    # Post-Remediation Validation Tasks
    - name: Validation - Verify system crypto policy is set to DEFAULT
      ansible.builtin.command: update-crypto-policies --show
      register: crypto_policy_check
      changed_when: false
      failed_when: "'DEFAULT' not in crypto_policy_check.stdout"

    - name: Validation - Verify RSA key bit size on Node 2 is 2048 bits
      ansible.builtin.command: openssl rsa -in /etc/pki/tls/private/demo.key -text -noout
      register: rsa_key_check
      changed_when: false
      failed_when: "'2048 bit' not in rsa_key_check.stdout"
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])

    - name: Validation - Verify SSL parameters override file is absent on Node 2
      ansible.builtin.stat:
        path: /etc/httpd/conf.d/ssl-params.conf
      register: ssl_params_check
      failed_when: ssl_params_check.stat.exists
      when: inventory_hostname == '10.46.253.221' or ansible_host | default('') == '10.46.253.221' or '10.46.253.221' in ansible_all_ipv4_addresses | default([])

    - name: Validation - Verify httpd service is active
      ansible.builtin.command: systemctl is-active httpd
      register: httpd_status_check
      changed_when: false
      failed_when: httpd_status_check.stdout != "active"
